[project]
name = "pfeed-alphafund"
version = "0.0.1.dev1"
description = "alphafund as a data source plugin for pfeed"
readme = "README.md"
authors = [
    { name = "softwareentrepreneer", email = "softwareentrepreneer+pfeed-alphafund@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pfeed>=0.0.20",
    # "alphafund>=0.0.1",
]

[project.entry-points."pfeed.sources"]
alphafund = "pfeed_alphafund:AlphaFund"

[tool.uv]
# FIXME: set it back to "14 days" when the package is stable
exclude-newer = "0 days"
exclude-newer-package = { uv_build = false, pfund-blocks = false, pfund-kit = false, pfeed = false, alphafund = false }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest]
strict_markers = true
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
